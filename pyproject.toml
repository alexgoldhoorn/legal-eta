[project]
name = "legaleta"
version = "0.1.0"
description = "EU driving-time scheduler: inserts the breaks and rests Regulation (EC) 561/2006 requires into a planned route and returns the legal ETA. Planning aid, not legal advice."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Alex Goldhoorn" }]
keywords = ["logistics", "driving-time", "561/2006", "tachograph", "eta", "trucking"]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.6"]

[project.scripts]
legaleta = "legaleta.cli:main"
legaleta-mcp = "legaleta.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "mcp>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legaleta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["legaleta"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
